name: anchor

# The daily anchor of the record (B-89). Once a day, half an hour after
# drift.yml, this builds a small JSON document naming the master commit it ran
# at, whether the signed history up to it verified, the sha256 of that morning's
# drift output and of registry/index.json, and asks the public OpenTimestamps
# calendars to timestamp the document's sha256. See tools/anchor.mjs and the
# README's "Anchoring" section.
#
# The drift run happens HERE, not in drift.yml, because drift.yml keeps its
# output only as a 90-day Actions artifact: thirty mornings of drift checks had
# left no durable bytes. The bytes of this run's walker/drift.json and its log
# are committed beside the document, and the document hashes exactly those bytes.
# drift.yml and verify.yml are unchanged.
#
# Everything lands on the `anchors` branch, never on master: the commits there
# are made by github-actions[bot] and are unsigned, and master carries only
# signed commits. A push made with GITHUB_TOKEN starts no workflow run, so
# verify.yml does not run against the anchors branch.
#
# TWO JOBS, because master is not branch-protected. `stamp` runs npm ci, the
# build, the drift tool and the OpenTimestamps library -- third-party code, the
# library pulling in packages with open advisories -- and it holds a READ-ONLY
# token. `commit` holds the write token and runs no npm code at all: it takes
# the files `stamp` produced, refuses any name that is not a day's file, and
# pushes to refs/heads/anchors only.
#
# A day is stamped once. A day no calendar answered is committed as a document
# without a proof and the run goes red; it is never re-stamped later under the
# same date.

on:
  schedule:
    - cron: "30 6 * * *" # daily, 06:30 UTC (drift.yml runs at 06:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      date: ${{ steps.stamp.outputs.date }}
      rc: ${{ steps.stamp.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # verify-history walks the range since the previous anchored commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      # Exactly as drift.yml runs it: the exit code is captured, never obeyed.
      - name: Check upstream drift
        id: drift
        run: |
          set +e
          npm run drift 2>&1 | tee drift.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fetch the anchors branch, if there is one
        run: |
          if git ls-remote --exit-code --heads origin anchors >/dev/null; then
            git fetch --no-tags origin +refs/heads/anchors:refs/remotes/origin/anchors
          else
            echo "no anchors branch yet: this is the first anchored day"
          fi

      # The job's own log prints the document and its digests (stderr), then
      # the verify result with the proof as hex (stdout).
      - name: Stamp the day
        id: stamp
        run: |
          day=$(date -u +%F)
          echo "date=$day" >> "$GITHUB_OUTPUT"
          mkdir -p out
          if git cat-file -e "origin/anchors:anchors/$day.json.ots" 2>/dev/null; then
            echo "::notice::$day already carries a proof on the anchors branch; a day is stamped once"
            echo "rc=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          node tools/anchor.mjs stamp --out out --date "$day" \
            --drift-json walker/drift.json --drift-log drift.log \
            --drift-rc "${{ steps.drift.outputs.rc }}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upgrade pending proofs from the last fourteen days
        run: |
          git rev-parse -q --verify refs/remotes/origin/anchors >/dev/null || { echo "no anchors branch yet"; exit 0; }
          mkdir -p up
          for i in $(seq 1 14); do
            d=$(date -u -d "-$i day" +%F)
            git cat-file -e "origin/anchors:anchors/$d.json.ots" 2>/dev/null || continue
            git cat-file blob "origin/anchors:anchors/$d.json" > "up/$d.json"
            git cat-file blob "origin/anchors:anchors/$d.json.ots" > "up/$d.json.ots"
            cp "up/$d.json.ots" "up/$d.before"
            node tools/anchor.mjs upgrade "$d" --dir up || echo "::warning::upgrade of $d failed"
            if ! cmp -s "up/$d.json.ots" "up/$d.before"; then cp "up/$d.json.ots" "out/$d.json.ots"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: anchor-out
          path: out/
          if-no-files-found: ignore

  commit:
    needs: stamp
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        # No artifact means nothing was written: a day already stamped, and no proof upgraded.
        continue-on-error: true
        with:
          name: anchor-out
          path: out

      - uses: actions/checkout@v4
        with:
          path: branch

      - name: Commit to the anchors branch
        working-directory: branch
        run: |
          set -eu
          shopt -s nullglob
          files=(../out/*)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to commit"; exit 0; fi
          for f in "${files[@]}"; do
            n=$(basename "$f")
            if ! [[ "$n" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.(json|json\.ots|drift\.json|drift\.log)$ ]]; then
              echo "::error::refusing an unexpected file from the stamp job: $n"
              exit 1
            fi
          done
          if git ls-remote --exit-code --heads origin anchors >/dev/null; then
            git fetch --no-tags --depth=1 origin +refs/heads/anchors:refs/remotes/origin/anchors
            git switch -C anchors refs/remotes/origin/anchors
          else
            git switch --orphan anchors
            printf '%s\n' '# Documents and proofs are byte-exact: never normalize line endings.' '* -text' > .gitattributes
            git add .gitattributes
          fi
          mkdir -p anchors
          cp "${files[@]}" anchors/
          git add anchors
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              -c commit.gpgsign=false \
              commit -q -m "anchor: ${{ needs.stamp.outputs.date }}"
          git log -1 --stat --format='%H %s'
          git push origin HEAD:refs/heads/anchors

      - name: Fail the run when the day was not stamped
        if: needs.stamp.outputs.rc != '0'
        run: |
          echo "::error::anchor.mjs stamp exited ${{ needs.stamp.outputs.rc }} for ${{ needs.stamp.outputs.date }}; the document and drift bytes are committed without a proof"
          exit 1
